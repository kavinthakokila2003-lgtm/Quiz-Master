<style>
:root{--ink:#171b2b;--muted:#888c9b;--paper:#f5f6f8;--white:#fff;--line:#e9eaf0;--violet:#6755e8;--vl:#f0edff;--mint:#42bd93;--amber:#f4aa46;--shadow:0 10px 32px #20253c0c;--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(calc((100vw - 1190px)/2),32px);justify-content:space-between}.brand{font-family:Manrope,sans-serif;font-size:23px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:9px}.brand .mark{height:34px;width:34px;border-radius:11px;color:white;display:grid;place-items:center;background:var(--violet);font-size:18px}.brand b{color:var(--violet)}.tagline{font-size:12px;color:var(--muted);margin:4px 0 0}.bar-right{display:flex;align-items:center;gap:18px}.pill{background:#f1f0ff;color:#6655d8;border-radius:30px;padding:8px 13px;font-size:12px;font-weight:700}.avatar{background:#eceaff;border-radius:50%;height:38px;width:38px;display:grid;place-items:center;color:#5e50cc;font-weight:800}.layout{max-width:1190px;margin:30px auto;display:grid;grid-template-columns:240px 1fr;gap:27px;padding:0 4px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;height:max-content;position:sticky;top:20px}.side-label{text-transform:uppercase;letter-spacing:1.2px;font-size:10px;font-weight:800;color:#a4a6b2;margin:9px 9px 13px}.nav{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#737789;border-radius:11px;text-align:left;padding:12px;margin:2px 0;font-weight:600}.nav:hover,.nav.active{background:var(--vl);color:var(--violet)}.nav .ico{width:18px;text-align:center;font-size:16px}.nav .count{margin-left:auto;background:#eceaff;color:#6453dd;padding:3px 7px;border-radius:10px;font-size:10px}.side-bottom{border-top:1px lace-items:center;font-weight:800}.round-name{font-weight:700;font-size:12px}.round-desc{font-size:10px;color:var(--muted);margin-top:4px}.badge{border-radius:30px;font-size:10px;font-weight:700;padding:6px 9px;background:#f1f1f4;color:#797d8b}.badge.live{background:#e6f7ef;color:#2f9c71}.badge.lock{background:#fff4e5;color:#ce8b34}.feed-item{display:flex;gap:11px;padding:11px 0;border-top:1px solid #f0f0f3;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;margin-top:4px;background:#6654dc;flex-shrink:0}.feed-item strong{font-size:11px}.feed-item small{display:block;color:var(--muted);margin-top:4px}.table-panel{padding:20px 21px}.table{width:100%;border-collapse:collapse;text-align:left}.table th{font-size:10px;color:#9a9daa;text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:11px 8px;border-bottom:1px solid var(--line)}.table td{padding:13px 8px;border-bottom:1px solid #f0f0f3;font-size:11px}.team-cell{display:flex;gap:10px;align-items:center;font-weight:700}.team-mark{height:29px;width:29px;border-radius:9px;background:#f0eeff;color:#6351d7;display:grid;place-items:center;font-weight:800}.rank{color:#9093a0;font-weight:700}.pts{font-weight:800}.rankboard{padding:21px}.rankboard .table td{padding:16px 9px}.medal{font-size:17px}.page{display:none}.page.active{display:block}.hero{padding:22px 25px;border-radius:20px;background:linear-gradient(120deg,#6652e5,#8374f2);color:#fff;display:flex;justify-content:space-between;align-items:center;margin:3px 0 18px;overflow:hidden;position:relative}.hero:after{content:'✦';position:absolute;right:31%;font-size:104px;color:#ffffff12;top:-19px}.hero h2{font-size:22px}.hero p{color:#eeecff;font-size:12px}.hero .btn{background:white;color:#5e4bdb;position:relative;z-index:1}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin:0 0 15px;padding:0 0 12px}.tab{border:0;background:transparent;padding:9px 13px;border-radius:8px;color:#898c99;font-size:11px;font-weight:700}.tab.active{background {display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f0f3;padding:12px 0;font-size:11px}.switch{width:32px;height:18px;background:#ddd;border-radius:11px;position:relative}.switch:after{content:'';position:absolute;width:13px;height:13px;left:3px;top:2.5px;border-radius:50%;background:white}.switch.on{background:#6955e7}.switch.on:after{left:16px}.upload{border:1px dashed #d9d7e5;border-radius:11px;padding:17px 11px;text-align:center;color:#888c99;font-size:10px;line-height:1.7}.upload .big{font-size:22px;display:block;color:#7061df}.upload input{display:none}.export-card{background:#f8f7ff;border-radius:12px;padding:16px;margin-top:13px}.export-card p{font-size:10px;color:#777b89;line-height:1.6}.project-preview{background:#171928;border-radius:15px;color:white;padding:22px;margin-top:17px}.project-preview .table td,.project-preview .table th{color:#fff;border-color:#2b2d3b}.project-preview .table th{color:#9699aa}.project-preview .pts{color:#c5bdff}.project-preview .team-mark{background:#2b2844;color:#c9c2ff}.team-login{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 53% 30%,#efecff 0%,#f5f6f8 52%)}.login-card{width:min(430px,100%);padding:31px;background:#fff;border:1px solid var(--line);border-radius:21px;box-shadow:0 20px 55px #2d30500c}.login-card h1{font-size:25px}.login-card .sub{line-height:1.6}.login-card .field{margin-top:20px}.login-card input{height:47px;font-size:13px}.login-card .btn{width:100%;margin-top:13px;padding:13px}.hint{background:#f7f6ff;color:#7d759f;padding:10px 12px;border-radius:9px;font-size:10px;margin-top:14px;line-height:1.5}.waiting{max-width:750px;margin:54px auto;padding:0 20px}.waiting-card{text-align:center;padding:40px 30px}.waiting-icon{height:68px;width:68px;border-radius:22px;background:#f0edff;color:#6a57df;display:grid;place-items:center;font-size:29px;margin:0 auto 20px}.waiting-card h1{font-size:26px}.waiting-card .sub{max-width:410px;margin:10px auto 22px;line-height:1.7}.team-tag{background:#f4f2ff;color:#5f4fd3;display:inline-flex;padding:9px 14px;border-radius:10px;font-weight:800;letter-spacing:.5px}.wait-steps{display:flex;justify-content:center;gap:7px;margin:27px auto 18px}.step-dot{height:6px;width:40px;background:#e5e5ed;border-radius:5px}.step-dot.done{background:#6a57df}.question-play{max-width:850px;margin:30px auto;padding:0 18px}.play-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.timer{font:800 18px Manrope;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px}.timer span{font-size:11px;font-weight:600;color:var(--muted)}.progressline{height:5px;background:#e8e8ee;border-radius:5px;margin-bottom:19px}.progressline i{display:block;height:100%;background:var(--violet);border-radius:5px}.play-question{padding:28px}.play-question h2{font-size:21px;line-height:1.5;margin:13px 0 23px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#fff;border:1px solid var(--line);border-radius:11px;text-align:left;padding:15px;font-size:12px;color:#464a5b}.choice:hover,.choice.selected{border-color:#8879eb;background:#f5f3ff;color:#5e4cce}.choice b{display:inline-grid;width:22px;height:22px;border-radius:7px;background:#f1f1f5;place-items:center;margin-right:9px;font-size:10px}.result-card{padding:25px;margin:18px 0}.site-foot{text-align:center;color:#aaaeb9;font-size:10px;padding:25px}@media(max-width:950px){.layout{grid-template-columns:195px 1fr;gap:17px;margin:20px auto;padding:0 15px}.stats{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.topbar{padding:0 20px}.question-layout{grid-template-columns:1fr}}@media(max-width:650px){.topbar{height:65px;padding:0 15px}.tagline,.bar-right .pill{display:none}.layout{display:block;margin:17px auto;padding:0 12px}.sidebar{position:static;display:flex;gap:2px;overflow:auto;padding:7px;margin-bottom:18px}.side-label,.side-bottom{display:none}.nav{width:auto;white-space:nowrap;padding:10px;font-size:11px;gap:7px}.stats{gap:9px}.stat{padding:14px}.stat-value{font-size:23px}.welcome{align-items:flex-start;gap:10px}.welcome h1{font-size:24px}.welcome .btn{padding:10px;font-size:10px;white-space:nowrap}.round-cards{grid-template-columns:1fr}.table-wrap{overflow:auto}.table{min-width:530px}.question-play{margin:20px auto}.play-question{padding:20px}.play-question h2{font-size:18px}.choices{grid-template-columns:1fr}.hero{padding:20px}.hero .btn{font-size:10px;padding:9px}.search{width:140px}.panels{gap:12px}.team-login{min-height:calc(100vh - 65px)}}
</style></head>
<body><div id="app" class="app"></div><script>
const starterTeams=[{name:'The Brainiacs',code:'BRAIN7',points:284,progress:'4/4',status:'Complete',speed:42},{name:'Quiztopher Nolan',code:'QZ4821',points:261,progress:'3/4',status:'In round 4',speed:67},{name:'Ctrl Alt Elite',code:'CTRL09',points:248,progress:'3/4',status:'In round 4',speed:74},{name:'The Think Tank',code:'THINK3',points:227,progress:'2/4',status:'In round 3',speed:82},{name:'Trivia Titans',code:'TRIV88',points:206,progress:'2/4',status:'In round 3',speed:89},{name:'No Googling!',code:'NOGL42',points:183,progress:'1/4',status:'In round 2',speed:95}];
const rounds=[{name:'Warm Up',q:10,time:'08:00',status:'Completed',n:1},{name:'Science & Nature',q:12,time:'10:00',status:'In progress',n:2},{name:'Around the World',q:12,time:'10:00',status:'Locked',n:3},{name:'The Final Sprint',q:8,time:'06:00',status:'Locked',n:4}];
let S;try{S=JSON.parse(localStorage.getItem('quizlyData'))}catch{} if(!S)S={teams:starterTeams.map(x=>({...x})),rounds:rounds.map(x=>({...x,active:x.n===2,ended:x.n===1})),running:true,leaderboard:true,feedback:'after round',quizName:'Quiz night',duration:10,points:10,qcount:12,passwords:{},questions:[],phase:'login',tab:'Overview',role:'admin'};
let ADMIN_TOKEN=localStorage.getItem('quizlyAdminToken')||'',TEAM_TOKEN=sessionStorage.getItem('quizlyTeamToken')||'';async function api(url,method='GET',body){const token=url.startsWith('/api/team')?TEAM_TOKEN:ADMIN_TOKEN;const res=await fetch(url,{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Request failed');return data}function save(){localStorage.setItem('quizlyData',JSON.stringify(S));if(ADMIN_TOKEN&&S.role==='admin')api('/api/admin/state','PUT',S).catch(e=>toast('Save failed: '+e.message))}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}function pass(){let b=new Uint8Array(8);crypto.getRandomValues(b);return [...b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}function badge(s){return `<span class="badge ${s==='In progress'?'live':s==='Locked'?'lock':s==='Live'?'live':''}">${esc(s)}</span>`}const icon={Overview:'▦',Rounds:'◷',Teams:'♧',Questions:'▤','Live board':'♜',Settings:'⚙'};
function shell(content,active='Overview'){return `<header class="topbar"><div><div class="brand"><span class="mark">Q</span>quiz<b>ly</b></div><p class="tagline">Your tournament, in the spotlight.</p></div><div class="bar-right"><span class="pill">${S.running?'● Live tournament':'Tournament paused'}</span><div class="avatar">A</div></div></header><div class="layout"><aside class="sidebar"><div class="side-label">Tournament</div>${['Overview','Rounds','Teams','Questions','Live board','Settings'].map(x=>`<button class="nav ${active===x?'active':''}" onclick="go('${x}')"><span class="ico">${icon[x]}</span>${x}${x==='Teams'?`<span class="count">${S.teams.length}</span>`:''}</button>`).join('')}<div class="side-bottom">${esc(S.quizName)}<br>Admin workspace · Season 2025</div></aside><main class="main">${content}</main></div>`}
function head(title,desc,button=''){return `<div class="welcome"><div><div class="eyebrow">${esc(S.quizName)} &nbsp; / &nbsp; Admin</div><h1>${title}</h1><p class="sub">${desc}</p></div>${button}</div>`}function btn(label,action,cls=''){return `<button class="btn ${cls}" onclick="${action}">${label}</button>`}
function stats(){let complete=S.teams.filter(t=>t.status==='Complete').length;return `<div class="stats">${[['Teams registered',S.teams.length,'▲ &nbsp;Active participants','♧'],['Quiz status',S.running?'Live':'Paused',S.running?'Round 2 is open':'Resume any time','◉'],['Questions',S.questions.length||42,'Across 4 rounds','▤'],['Completed',complete,`${S.teams.filter(t=>t.status!=='Complete').length} teams playing`,'✓']].map(([l,v,f,i])=>`<article class="card stat"><div class="stat-label">${l}</div><span class="stat-icon">${i}</span><div class="stat-value" style="${l==='Quiz status'?'font-size:20px':''}">${v}</div><div class="stat-foot">${f}</div></article>`).join('')}</div>`}
function standings(limit=5){return `<div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Team</th><th>Points</th><th>Round</th><th>Status</th></tr></thead><tbody>${[...S.teams].sort((a,b)=>b.points-a.points).slice(0,limit).map((t,i)=>`<tr><td class="rank">${['🥇','🥈','🥉'][i]||String(i+1).padStart(2,'0')}</td><td><div class="team-cell"><span class="team-mark">${esc(t.name[0])}</span>${esc(t.name)}</div></td><td class="pts">${t.points}</td><td>${t.progress}</td><td>${badge(t.status==='Complete'?'Complete':'Live')}</td></tr>`).join('')}</tbody></table></div>`}
function overview(){return shell(`${head(`Good ${new Date().getHours()<12?'morning':'afternoon'}, Admin 👋`,`Here’s what’s happening in your tournament today.`,btn('↗ &nbsp;Project leaderboard','go(\'Live board\')','light'))}${stats()}<div class="panels"><section class="card panel"><div class="panel-head"><h2>Round progress</h2><button class="small-link" onclick="go('Rounds')">Manage rounds →</button></div>${S.rounds.map(r=>`<div class="round-row"><div class="round-n">${r.n}</div><div><div class="round-name">${esc(r.name)}</div><div class="round-desc">${r.q} questions &nbsp;·&nbsp; ${r.time} minutes</div></div>${badge(r.status)}</div>`).join('')}</section><section class="card panel"><div class="panel-head"><h2>Activity</h2><span class="badge live">Live feed</span></div>${[['Quiz opened','Round 2 is now live for all teams','2 min ago'],['New team joined','Trivia Titans entered the quiz','8 min ago'],['Round completed','The Brainiacs finished round 1','14 min ago']].map(a=>`<div class="feed-item"><span class="dot"></span><div><strong>${a[0]}</strong><small>${a[1]} · ${a[2]}</small></div></div>`).join('')}</section></div><section class="card table-panel"><div class="panel-head"><h2>Leaderboard</h2><button class="small-link" onclick="go('Live board')">Full leaderboard →</button></div>${standings()}</section>`)}
function roundsPage(){return shell(`${head('Manage rounds','Control the pace, passwords and scoring for every round.',btn('＋ &nbsp;Add round','addRound()'))}<div class="hero"><div><div class="eyebrow" style="color:#dad6ff">TOURNAMENT CONTROL</div><h2>${S.running?'Round 2 is live':'Tournament paused'}</h2><p>${S.teams.filter(t=>t.status!=='Complete').length} teams can currently submit answers.</p></div>${btn(S.running?'⏸ &nbsp;Pause tournament':'▶ &nbsp;Resume tournament','toggleRun()','light')}</div><div class="tabs">${['All rounds','In progress','Locked','Completed'].map((t,i)=>`<button class="tab ${i===0?'active':''}" onclick="filterRounds('${t}',this)">${t}</button>`).join('')}</div><div class="round-cards" id="roundCards">${roundCards()}</div>`,'Rounds')}
function roundCards(filter='All rounds'){return S.rounds.filter(r=>filter==='All rounds'||r.status===filter).map(r=>`<article class="card round-card"><div class="round-top"><div class="round-title"><span class="round-n">${r.n}</span><div><strong>${esc(r.name)}</strong><small>Round ${r.n}</small></div></div>${badge(r.status)}</div><div class="round-meta"><span>▤ <strong>${r.q}</strong> questions</span><span>◷ <strong>${r.time}</strong> min</span></div><div style="font-size:10px;color:#9497a4">Teams finished <strong style="color:var(--ink)">${r.ended?'6 / 6':r.active?'2 / 6':'0 / 6'}</strong></div><div class="bar"><i style="width:${r.ended?'100%':r.active?'32%':'0%'}"></i></div><div class="row-actions">${r.status==='Locked'?btn('▶ &nbsp;Open round',`openRound(${r.n})`,'tiny'):r.active?btn('🔑 &nbsp;Generate passwords',`makePasswords(${r.n})`,'tiny light'):btn('✓ &nbsp;Completed','', 'tiny light')}<button class="btn tiny light" onclick="editRound(${r.n})">⚙ &nbsp;Configure</button><span class="badge" style="margin-left:auto">${r.active?'Password required':''}</span></div></article>`).join('')}
function filterRounds(f,b){document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('roundCards').innerHTML=roundCards(f)}
function teamsPage(){return shell(`${head('Teams & access','Manage registered teams and securely issue their codes.',btn('↓ &nbsp;Download codes','downloadCodes()','light'))}<div class="teams-head"><div class="toolbar"><input class="input search" placeholder="⌕  Search teams..." oninput="searchTeams(this.value)"><span class="badge">${S.teams.length} teams</span></div><div class="toolbar">${btn('＋ &nbsp;Add team','addTeam()','tiny light')}${btn('↗ &nbsp;Import CSV','document.getElementById(\'teamfile\').click()','tiny')}<input type="file" id="teamfile" hidden accept=".csv" onchange="importTeams(this.files[0])"></div></div><section class="card table-panel" id="teamsTable">${teamTable()}</section>`,'Teams')}
function teamTable(q=''){return `<div class="table-wrap"><table class="table"><thead><tr><th>Team name</th><th>Team code</th><th>Score</th><th>Progress</th><th>Status</th><th>Action</th></tr></thead><tbody>${S.teams.filter(t=>t.name.toLowerCase().includes(q.toLowerCase())).map(t=>`<tr><td><div class="team-cell"><span class="team-mark">${esc(t.name[0])}</span>${esc(t.name)}</div></td><td><code>${esc(t.code)}</code> <button class="small-link" onclick="copyText('${t.code}')">⧉</button></td><td class="pts">${t.points}</td><td>${t.progress}</td><td>${badge(t.status==='Complete'?'Complete':'Live')}</td><td><button class="small-link" onclick="newCode('${t.code}')">↻ Reset</button></td></tr>`).join('')}</tbody></table></div>`}function searchTeams(q){document.getElementById('teamsTable').innerHTML=teamTable(q)}
const sampleQ=[['ROUND 01 · Q4','Which planet has the most moons currently known?','Saturn','Saturn'],['ROUND 02 · Q1','What is the smallest bone in the human body?','Stapes','Stapes'],['ROUND 02 · Q2','Which element has the chemical symbol Fe?','Iron','Iron'],['ROUND 02 · Q3','What is the largest desert in the world?','Antarctic Desert','Antarctic Desert']];
function questionsPage(){return shell(`${head('Question bank','Build, score and review questions across all rounds.',btn('＋ &nbsp;Add question','addQuestion()'))}<div class="tabs"><button class="tab active">All questions &nbsp;·&nbsp; ${S.questions.length+42}</button><button class="tab">Round 1</button><button class="tab">Round 2</button><button class="tab">Round 3</button><button class="tab">Round 4</button><button class="tab" onclick="document.getElementById('qfile').click()">↑ &nbsp;Import CSV</button><input type="file" id="qfile" hidden accept=".csv" onchange="importQuestions(this.files[0])"></div><div class="question-layout"><section class="card">${[...sampleQ,...S.questions].map((q,i)=>`<div class="question"><div class="qtop"><span>${esc(q[0]||'ROUND 02 · NEW')}</span><span class="correct-key">${q[4]||10} pts</span></div><p>${esc(q[1])}</p><div class="answer">Correct answer: <b>${esc(q[2])}</b></div></div>`).join('')}</section><aside><section class="card control-box"><h3>Round scoring</h3><div class="field"><label>Correct answer points</label><input type="number" id="scoreInput" value="${S.points}" min="0" onchange="S.points=+this.value;save()"></div><div class="field"><label>Speed bonus (admin only)</label><input type="number" value="5" min="0"></div><div style="font-size:10px;color:#9295a1;line-height:1.6">Speed bonus is visible to admins only and breaks ties. It does not change answer scores.</div></section><section class="card control-box"><h3>Import question bank</h3><label class="upload"><span class="big">↑</span>Drop a CSV here or <u>browse files</u><br>Question, options, correct answer, points</label></section></aside></div>`,'Questions')}
function boardHTML(big=false){return `<section class="card ${big?'rankboard':'panel'}"><div class="panel-head"><h2>🏆 &nbsp;Live leaderboard</h2><span class="badge live">Updated live</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Team</th><th>Points</th><th>Progress</th><th>Status</th></tr></thead><tbody>${[...S.teams].sort((a,b)=>b.points-a.points).map((t,i)=>`<tr><td class="rank">${['🥇','🥈','🥉'][i]||String(i+1).padStart(2,'0')}</td><td><div class="team-cell"><span class="team-mark">${esc(t.name[0])}</span>${esc(t.name)}</div></td><td class="pts">${t.points}</td><td>${t.progress}</td><td>${badge(t.status==='Complete'?'Complete':'Live')}</td></tr>`).join('')}</tbody></table></div></section>`}
function boardPage(){return shell(`${head('Audience leaderboard','Project this live view. The admin controls stay private.',btn(S.leaderboard?'◉ &nbsp;Audience view is on':'○ &nbsp;Audience view is off','toggleBoard()','light'))}<div class="project-preview">${boardHTML(true)}</div><div style="display:flex;justify-content:flex-end;margin-top:12px">${btn('⛶ &nbsp;Open audience screen','audience()','light')}</div>`,'Live board')}
function settingsPage(){return shell(`${head('Tournament settings','Set the tournament details and participant experience.') }<section class="card control-box" style="max-width:700px;padding:24px"><h2 style="margin-bottom:18px">General</h2><div class="field"><label>Tournament name</label><input value="${esc(S.quizName)}" onchange="S.quizName=this.value;save()"></div><div class="field"><label>Answer feedback</label><select onchange="S.feedback=this.value;save()"><option ${S.feedback==='after round'?'selected':''}>after round</option><option ${S.feedback==='after tournament'?'selected':''}>after tournament</option></select></div><div class="switch-row"><div><strong>Reveal correct answers</strong><div style="color:#9295a1;margin-top:4px">After participants complete all rounds</div></div><div class="switch on"></div></div><div class="switch-row"><div><strong>Show leaderboard to audience</strong><div style="color:#9295a1;margin-top:4px">Participants never see admin controls</div></div><div class="switch ${S.leaderboard?'on':''}" onclick="toggleBoard()"></div></div><div class="export-card"><strong>Export answer sheets</strong><p>Download every team’s answers, correctness, score and completion times as a CSV.</p>${btn('↓ &nbsp;Export all answers','exportAnswers()','tiny')}</div></section>`,'Settings')}
function admin(){let p={Overview:overview,Rounds:roundsPage,Teams:teamsPage,Questions:questionsPage,'Live board':boardPage,Settings:settingsPage};return p[S.tab]()}function join(){S.phase='waiting';save();render()}function waiting(){let r=S.rounds.find(x=>x.active&&(S.teamProgress||0)<x.n);return `<header class="topbar"><div><div class="brand"><span class="mark">Q</span>quiz<b>ly</b></div><p class="tagline">${esc(S.quizName)} · Team portal</p></div><span class="pill">● ${S.running?'Connected':'Waiting for host'}</span></header><div class="waiting"><section class="card waiting-card"><div class="waiting-icon">◷</div><div class="eyebrow">YOU’RE IN THE RIGHT PLACE</div><h1>Welcome, ${esc(S.teamName)}!</h1><p class="sub">Your team is checked in. Hang tight — the host will open the next round shortly.</p><span class="team-tag">TEAM CODE &nbsp; ${esc(S.teamCode)}</span><div class="wait-steps"><span class="step-dot done"></span><span class="step-dot ${r?'done':''}"></span><span class="step-dot"></span><span class="step-dot"></span></div><strong>${r?`Round ${r.n}: ${esc(r.name)}`:'Waiting for host to start'}</strong><p class="sub" style="font-size:11px">${r?`Your host has opened this round. Enter your team password to begin.`:'You will be moved into the round automatically when it begins.'}</p>${r?`<div class="field" style="max-width:300px;margin:20px auto 0"><input id="roundPass" placeholder="Round password" style="text-align:center;letter-spacing:2px;text-transform:uppercase"></div><button class="btn" style="margin-top:12px" onclick="startPlay()">Enter round →</button>`:''}<div style="margin-top:20px">${btn('Leave team','leaveTeam()','light tiny')}</div></section></div>`}
function login(){return `<header class="topbar"><div><div class="brand"><span class="mark">Q</span>quiz<b>ly</b></div><p class="tagline">${esc(S.quizName)} · Team portal</p></div><button class="small-link" onclick="S.role='admin';S.tab='Overview';render()">Admin sign in →</button></header><div class="team-login"><section class="login-card"><div class="eyebrow">WELCOME, TEAM</div><h1>Ready to play?</h1><p class="sub">Enter the team code your host gave you to join the tournament.</p><div class="field"><label>YOUR TEAM CODE</label><input id="teamCode" placeholder="e.g. BRAIN7" autocomplete="off" onkeydown="if(event.key==='Enter')joinCode()"></div><button class="btn" onclick="joinCode()">Join tournament &nbsp;→</button><div class="hint">Team code missing? Ask your tournament host for your unique team code.</div><div style="text-align:center;margin-top:18px"><button class="small-link" onclick="S.role='admin';S.tab='Overview';render()">Admin access</button></div></section></div>`}
function play(){return `<header class="topbar"><div class="brand"><span class="mark">Q</span>quiz<b>ly</b></div><div class="bar-right"><span class="pill">${esc(S.teamName)}</span><div class="timer" id="roundTimer">--:-- <span>remaining</span></div></div></header><div class="question-play"><div class="play-top"><div><div class="eyebrow">ROUND 02 &nbsp;·&nbsp; SCIENCE & NATURE</div><strong>Question 1 of 1</strong></div>${btn('Finish round','finishRound()','light tiny')}</div><div class="progressline"><i style="width:100%"></i></div><section class="card play-question"><div class="qtop"><span>QUESTION 01</span><span class="badge">10 points</span></div><h2>What is the chemical symbol for gold?</h2><div class="choices">${['Ag','Au','Fe','Gd'].map((c,i)=>`<button class="choice" onclick="selectChoice(this,'${c}')"><b>${String.fromCharCode(65+i)}</b>${c}</button>`).join('')}</div><div style="display:flex;justify-content:flex-end;margin-top:21px">${btn('Submit answer & finish →','finishRound()','tiny')}</div></section><p class="sub" style="text-align:center;font-size:11px">Your answer locks when you finish this round.</p></div>`}
function done(){return `<header class="topbar"><div class="brand"><span class="mark">Q</span>quiz<b>ly</b></div></header><div class="waiting"><section class="card waiting-card"><div class="waiting-icon" style="color:#32a878;background:#e7f7ef">✓</div><div class="eyebrow">ROUND COMPLETE</div><h1>Nice work, ${esc(S.teamName)}!</h1><p class="sub">Your answers are locked. Your host will share the password when the next round opens.</p><span class="team-tag">ROUND ${S.completedRound||2} COMPLETE</span>${btn('Back to waiting area','S.phase=\'waiting\';render()','light')}</section></div>`}
function audiencePage(){return `<main style="min-height:100vh;background:#151724;color:white;padding:clamp(20px,6vw,70px)"><div style="max-width:1050px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:34px"><div><div class="eyebrow" style="color:#b4aaff">LIVE TOURNAMENT</div><h1 style="font-size:clamp(30px,5vw,52px)">${esc(S.quizName)}</h1><p style="color:#a7a9b8">🏆 &nbsp;${S.rounds.find(r=>r.active)?.name||'Leaderboard'} &nbsp;·&nbsp; Live standings</p></div><span class="badge live">● LIVE</span></div><section style="background:#1d2030;border:1px solid #2b2d3c;border-radius:20px;padding:clamp(15px,3vw,31px)">${boardHTML(true)}</section><div style="text-align:center;color:#676a7a;padding-top:24px;font-size:11px">quizly &nbsp;·&nbsp; Tournament leaderboard</div></div></main>`}
function adminLogin(){return `<header class="topbar"><div class="brand"><span class="mark">Q</span>quiz<b>ly</b></div></header><div class="team-login"><section class="login-card"><div class="eyebrow">TOURNAMENT ADMIN</div><h1>Sign in to manage</h1><p class="sub">Your admin password keeps the tournament controls private.</p><div class="field"><label>ADMIN PASSWORD</label><input type="password" id="adminPassword" onkeydown="if(event.key==='Enter')adminSignIn()"></div><button class="btn" onclick="adminSignIn()">Sign in →</button><div class="hint">Set ADMIN_PASSWORD on the server before sharing this site.</div></section></div>`}
function render(){document.title=`Quizly — ${S.role==='admin'?'Admin':'Team quiz'}`;const root=document.getElementById('app');root.innerHTML=S.phase==='play'?play():S.phase==='done'?done():S.role==='admin'?(ADMIN_TOKEN?admin():adminLogin()):S.role==='audience'?audiencePage():S.phase==='waiting'?waiting():login();if(S.role==='audience')setTimeout(async()=>{if(S.role==='audience'){try{S=Object.assign(S,await api('/api/public/state'))}catch{}render()}},3000);if(S.phase==='play'&&S.currentDeadline)setTimeout(()=>{if(S.phase==='play'){const sec=Math.max(0,Math.ceil((S.currentDeadline-Date.now())/1000)),el=document.getElementById('roundTimer');if(sec===0){S.phase='waiting';render()}else{if(el)el.innerHTML=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')} <span>remaining</span>`;renderTick()}}},1000);if(S.role==='participant'&&S.phase==='waiting'&&TEAM_TOKEN)setTimeout(async()=>{if(S.role==='participant'&&S.phase==='waiting'){try{const d=await api('/api/team/state');S=Object.assign(S,d.state,{teamName:d.team.name,teamCode:d.team.code,teamProgress:Number((d.team.progress||'0/4').split('/')[0])});render()}catch{}}},3000)}
async function renderTick(){if(S.phase==='play'&&S.currentDeadline)setTimeout(()=>{if(S.phase!=='play')return;const sec=Math.max(0,Math.ceil((S.currentDeadline-Date.now())/1000)),el=document.getElementById('roundTimer');if(sec===0){S.phase='waiting';render()}else{if(el)el.innerHTML=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')} <span>remaining</span>`;renderTick()}},1000)}async function adminSignIn(){try{const res=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('adminPassword').value})}),d=await res.json();if(!res.ok)throw Error(d.error);ADMIN_TOKEN=d.token;localStorage.setItem('quizlyAdminToken',ADMIN_TOKEN);S=await api('/api/admin/state');S.role='admin';S.phase='admin';render()}catch(e){toast(e.message)}}
function go(t){S.tab=t;S.role='admin';S.phase='admin';save();render()}async function joinCode(){try{const res=await fetch('/api/team/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:document.getElementById('teamCode').value})}),d=await res.json();if(!res.ok)throw Error(d.error);TEAM_TOKEN=d.token;sessionStorage.setItem('quizlyTeamToken',TEAM_TOKEN);S.teamCode=d.team.code;S.teamName=d.team.name;S.teamProgress=Number((d.team.progress||'0/4').split('/')[0])||0;S=Object.assign(S,d.state);S.role='participant';S.phase='waiting';render()}catch(e){toast(e.message)}}
async function startPlay(){try{const r=S.rounds.find(x=>x.active);if(!r)throw Error('Your host has not opened a round yet.');const entry=await api('/api/team/verify-round','POST',{round:r.n,password:document.getElementById('roundPass').value});S.currentDeadline=entry.round.deadlineAt||0;S.phase='play';render()}catch(e){toast(e.message)}}let selectedAnswer='';function selectChoice(b,answer){selectedAnswer=answer;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}async function finishRound(){let r=S.rounds.find(x=>x.active);if(!selectedAnswer){toast('Choose an answer before you submit.');return}try{const result=await api('/api/team/finish-round','POST',{round:r?.n,answer:selectedAnswer,elapsedMs:0});S.teamProgress=Number(result.progress.split('/')[0])}catch(e){toast(e.message);return}S.phase='done';S.completedRound=r?.n||2;render()}
function toggleRun(){S.running=!S.running;save();render()}function toggleBoard(){S.leaderboard=!S.leaderboard;save();render()}function audience(){S.role='audience';render()}function addTeam(){let n=prompt('Enter the team name:');if(!n)return;let c=code();S.teams.push({name:n,code:c,points:0,progress:'0/4',status:'Registered',speed:0});save();render();toast(`Team code ${c} created`)}function addRound(){let n=S.rounds.length+1,name=prompt('Round name:','New round');if(!name)return;S.rounds.push({name,q:10,time:'10:00',status:'Locked',n});save();render()}function openRound(n){let r=S.rounds.find(x=>x.n===n);if(!r)return;if(r.status!=='Locked'){toast('This round is already open or complete.');return}r.status='In progress';r.active=true;S.rounds.forEach(x=>{if(x.n!==n&&x.active){x.active=false;x.status='Completed';x.ended=true}});S.running=true;save();render();toast(`Round ${n} opened. Generate team passwords to admit participants.`)}function makePasswords(n){let r=S.rounds.find(x=>x.n===n);if(!r)return;if(!r.active){openRound(n);r=S.rounds.find(x=>x.n===n)}if(!r.deadlineAt)r.deadlineAt=Date.now()+parseInt(r.time)*60000;let lines=[];for(const t of S.teams){let p=pass();S.passwords[`${n}-${t.code}`]=p;lines.push(`${t.name}: ${p}`)}save();alert(`ROUND ${n} · INDIVIDUAL TEAM PASSWORDS\n\n${lines.join('\n')}\n\nEach password works for that team only.`)}function editRound(n){let r=S.rounds.find(x=>x.n===n),name=prompt('Round name',r.name);if(name===null)return;let duration=prompt('Time limit in minutes',parseInt(r.time));if(duration===null)return;r.name=name;r.time=`${duration.padStart(2,'0')}:00`;let q=prompt('Number of questions',r.q);if(q!==null)r.q=+q||r.q;save();render()}
function newCode(c){let t=S.teams.find(x=>x.code===c);if(!t)return;if(!confirm(`Reset access code for ${t.name}? The old code stops working.`))return;t.code=code();save();render()}function copyText(t){navigator.clipboard?.writeText(t);toast('Copied to clipboard')}function download(filename,content,type='text/csv'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=filename;a.click();URL.revokeObjectURL(a.href)}function downloadCodes(){download('quizly-team-codes.csv','Team,Code\n'+S.teams.map(t=>`"${t.name}",${t.code}`).join('\n'))}async function exportAnswers(){if(ADMIN_TOKEN){try{let r=await fetch('/api/admin/export.csv',{headers:{authorization:'Bearer '+ADMIN_TOKEN}});if(!r.ok)throw Error('Export failed');let a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='quizly-answers.csv';a.click();return}catch(e){toast(e.message);return}}let header='Team,Team code,Round,Question,Submitted answer,Correct answer,Correct,Points,Completion time (seconds)';let rows=S.teams.flatMap(t=>(S.questions.length?S.questions:sampleQ).map((q,i)=>`"${t.name}",${t.code},${q[0]},"${q[1]}","${i%2?q[2]:'(not submitted)'}","${q[2]}",${i%2?'Yes':'No'},${i%2?(q[4]||S.points):0},${t.speed+i*4}`));download('quizly-all-team-answers.csv',header+'\n'+rows.join('\n'))}function importTeams(f){if(!f)return;let rd=new FileReader;rd.onload=()=>{String(rd.result).split(/\r?\n/).slice(1).filter(Boolean).forEach(l=>{let n=l.split(',')[0].trim().replace(/^"|"$/g,'');if(n)S.teams.push({name:n,code:code(),points:0,progress:'0/4',status:'Registered',speed:0})});save();render();toast('Teams imported and access codes generated')};rd.readAsText(f)}function addQuestion(){let text=prompt('Question text');if(!text)return;let answer=prompt('Correct answer');if(!answer)return;let round=prompt('Round name','Round 2'),pts=prompt('Points',S.points);S.questions.push([`ROUND 02 · NEW`,text,answer,answer,+pts||S.points]);save();render()}function importQuestions(f){if(!f)return;let rd=new FileReader;rd.onload=()=>{String(rd.result).split(/\r?\n/).slice(1).filter(Boolean).forEach(l=>{let c=l.split(',');if(c[0])S.questions.push(['ROUND 02 · IMPORT',c[0],c.at(-2)||'',c.at(-2)||'',+(c.at(-1))||S.points])});save();render();toast('Questions imported')};rd.readAsText(f)}function leaveTeam(){S.phase='login';S.role='participant';save();render()}function toast(s){let d=document.createElement('div');d.textContent=s;Object.assign(d.style,{position:'fixed',bottom:'22px',left:'50%',transform:'translateX(-50%)',padding:'12px 18px',background:'#242438',color:'white',borderRadius:'10px',fontSize:'12px',zIndex:10,boxShadow:'0 8px 25px #0003'});document.body.append(d);setTimeout(()=>d.remove(),2400)}
const route=location.pathname.split('/').pop().toLowerCase();async function boot(){if(route==='participant.html'){S.role='participant';S.phase='login'}else if(route==='audience.html'){S.role='audience';try{S=Object.assign(S,await api('/api/public/state'))}catch{}}else{S.role='admin';S.phase='admin';if(ADMIN_TOKEN){try{S=await api('/api/admin/state')}catch{ADMIN_TOKEN='';localStorage.removeItem('quizlyAdminToken')}}}S.tab=S.tab||'Overview';render()}boot();
</script></body></html>
